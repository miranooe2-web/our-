<script>
  // iOS home-screen icon, generated in-code (no image file needed):
  // rose→amber gradient with a white heart.
  (function () {
    try {
      var s = 180, c = document.createElement("canvas");
      c.width = c.height = s;
      var x = c.getContext("2d");
      var g = x.createLinearGradient(0, 0, s, s);
      g.addColorStop(0, "#fb7185");
      g.addColorStop(1, "#fbbf24");
      x.fillStyle = g;
      x.fillRect(0, 0, s, s);
      x.fillStyle = "rgba(255,255,255,0.14)";
      x.beginPath(); x.arc(142, 32, 66, 0, 7); x.fill();
      x.fillStyle = "#ffffff";
      x.save();
      x.translate(s / 2, s / 2 + 8);
      var k = 56;
      x.beginPath();
      x.moveTo(0, k * 0.9);
      x.bezierCurveTo(-k * 1.6, k * 0.05, -k * 1.15, -k * 0.95, 0, -k * 0.35);
      x.bezierCurveTo(k * 1.15, -k * 0.95, k * 1.6, k * 0.05, 0, k * 0.9);
      x.closePath();
      x.shadowColor = "rgba(190,18,60,0.28)";
      x.shadowBlur = 14;
      x.shadowOffsetY = 5;
      x.fill();
      x.restore();
      var link = document.createElement("link");
      link.rel = "apple-touch-icon";
      link.href = c.toDataURL("image/png");
      document.head.appendChild(link);
    } catch (e) { /* non-critical */ }
  })();
</script>
